name: Release

# Two semantic versions, both published at the merge, neither ever committed by this workflow.
#
# - The repository version, tag X.Y.Z with no prefix: what a consumer pins with `ref`, since a
#   `ref` checks out the whole marketplace at one commit. No file carries it. A pull request
#   declares its level with exactly one label, release:major, release:minor, release:patch or
#   release:none; the merge on master publishes the highest semver tag raised by that level, or
#   1.0.0 when no release exists yet.
# - A plugin version, tag <plugin>--v<version>: the `version` of the plugin's plugin.json, raised
#   by every pull request that changes the plugin, and the tag Claude Code resolves dependency
#   version ranges against.
#
# The release notes are the `## Release notes` section of the pull request body. This workflow
# never commits and never pushes a branch; master changes only through a merged pull request.
on:
  push:
    branches: [master]
  # No paths filter: the check must run on every pull request, or a required check that never
  # starts blocks the merge forever. labeled/unlabeled/edited re-run it when the label or the
  # notes change without a new commit.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

env:
  BASE: master
  RELEASE: .github/scripts/release.py

jobs:
  check:
    name: release label
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 for the three-dot diff against the base, the plugin versions of the base,
      # and the tags the next version is computed from.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read the base branch
        run: git fetch --no-tags --force origin "$BASE:refs/remotes/origin/$BASE"

      # The body is passed through a file: it is free text written by a person.
      - name: The pull request declares its release
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          python3 "$RELEASE" check-pr "origin/$BASE" "$RUNNER_TEMP/body.md" "$LABELS"

  publish:
    name: tag the release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Two merges in a row must not compute the same next version.
    concurrency:
      group: release
      cancel-in-progress: false
    # Raised on this job alone, the only one that writes, and it writes tags and a release.
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # The merge commit belongs to exactly one merged pull request. A push that came from no
      # pull request releases nothing: master is not pushed to directly.
      - name: Read the merged pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)][0] // empty' > "$RUNNER_TEMP/pr.json"
          if [ ! -s "$RUNNER_TEMP/pr.json" ]; then
            echo "::warning::$GITHUB_SHA comes from no merged pull request; nothing is released."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -r .body "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/body.md"
          echo "number=$(jq -r .number "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "labels=$(jq -c '[.labels[].name]' "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"

      - name: Compute the versions
        id: version
        if: steps.pr.outputs.number != ''
        env:
          LABELS: ${{ steps.pr.outputs.labels }}
        run: |
          version=$(python3 "$RELEASE" next "$LABELS")
          if [ -z "$version" ]; then
            echo "Pull request #${{ steps.pr.outputs.number }} is release:none; no repository version."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "plugins=$(python3 "$RELEASE" plugin-tags | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # A published tag is never moved: a repository pinned to it must receive the same bytes
      # forever. The repository tag and the plugin tags all point at the merge commit.
      - name: Tag the release and the plugins
        if: steps.pr.outputs.number != '' && (steps.version.outputs.version != '' || steps.version.outputs.plugins != '')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLUGINS: ${{ steps.version.outputs.plugins }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in $VERSION $PLUGINS; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag is already published; a published tag is never moved"
              exit 1
            fi
            git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            echo "Published $tag on $GITHUB_SHA."
          done

      - name: Publish the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PLUGINS: ${{ steps.version.outputs.plugins }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          {
            python3 "$RELEASE" notes "$RUNNER_TEMP/body.md"
            if [ -n "$PLUGINS" ]; then
              printf '\nPlugin versions: %s\n' "$(echo $PLUGINS | sed 's/ /, /g')"
            fi
            printf '\nFrom #%s.\n' "$NUMBER"
          } > "$RUNNER_TEMP/notes.md"
          # A prerelease carries a hyphen before any build metadata, as in 1.2.0-rc.1+build.
          prerelease=""
          case "${VERSION%%+*}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$VERSION" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag $prerelease
          echo "Released $VERSION."
