name: Release

# The repository carries one semantic version: `version` in .claude-plugin/marketplace.json.
# A consumer's `ref` checks out the whole marketplace at one commit, so the release unit is the
# repository, and its tag is that version exactly, X.Y.Z, a valid Semantic Versioning 2.0.0
# string with no prefix. Each plugin keeps its own semantic version in its plugin.json, which is
# what Claude Code reads to decide that an installed plugin changed.
#
# No paths filter on the push, on purpose: the tag job is a no-op when the version is already
# tagged, and running it unconditionally lets it catch up on a version merged before it ran.
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "plugins/**"
      - ".claude-plugin/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
      - ".github/scripts/semver.py"

permissions:
  contents: read

env:
  BASE: master
  SEMVER: .github/scripts/semver.py
  CATALOG: .claude-plugin/marketplace.json

jobs:
  check:
    name: version agreement
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 for the three-dot diffs below, which need the merge base with the base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Semver or nothing: the repository version, every plugin version, and so every tag.
      - name: Every version is a semantic version
        run: |
          version=$(jq -r '.version // empty' "$CATALOG")
          if [ -z "$version" ]; then
            echo "::error::$CATALOG carries no top-level \"version\""
            exit 1
          fi
          versions="$version"
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            versions="$versions $(jq -r '.version // "missing"' "$manifest")"
          done
          python3 "$SEMVER" valid $versions
          echo "repository $version; plugins:$(for m in plugins/*/.claude-plugin/plugin.json; do printf ' %s %s' "$(basename "$(dirname "$(dirname "$m")")")" "$(jq -r .version "$m")"; done)"

      # The install snippets carry the tag literally. They are documentation, so nothing breaks
      # the day one drifts and nobody notices; every "ref" in the README must be the version.
      - name: Every README pin is the repository version
        run: |
          version=$(jq -r .version "$CATALOG")
          status=0
          for pinned in $(grep -oP '"ref":\s*"\K[^"]+' README.md); do
            if [ "$pinned" != "$version" ]; then
              echo "::error::the README pins $pinned and the repository version is $version"
              status=1
            fi
          done
          exit $status

      - name: Read the base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --force origin "$BASE:refs/remotes/origin/$BASE"

      # A changed plugin moves its own version, so that Claude Code sees the change.
      - name: Each changed plugin moved its version
        if: github.event_name == 'pull_request'
        run: |
          status=0
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            dir=$(dirname "$(dirname "$manifest")")
            name=$(basename "$dir")
            head=$(jq -r .version "$manifest")
            if ! git cat-file -e "origin/$BASE:$manifest" 2>/dev/null; then
              echo "$name: new plugin at $head."
              continue
            fi
            base=$(git show "origin/$BASE:$manifest" | jq -r .version)
            if git diff --quiet "origin/$BASE...HEAD" -- "$dir/"; then
              echo "$name: unchanged, stays at $base."
              continue
            fi
            if [ "$(python3 "$SEMVER" compare "$head" "$base")" != "1" ]; then
              echo "::error::$dir/ changed and its version went from $base to $head, not up"
              status=1
              continue
            fi
            echo "$name: $base -> $head."
          done
          exit $status

      # Anything a consumer receives through the pin, a plugin or the catalog itself, moves the
      # repository version. Without it no tag is published, and the change is merged and
      # unreachable, which is worse than not merged. The level is a human ruling (README).
      - name: The repository version moved with its content
        if: github.event_name == 'pull_request'
        run: |
          head=$(jq -r .version "$CATALOG")
          base=$(git show "origin/$BASE:$CATALOG" 2>/dev/null | jq -r '.version // empty' || true)
          changed=""
          git diff --quiet "origin/$BASE...HEAD" -- plugins/ || changed="plugins/"
          if [ "$(git show "origin/$BASE:$CATALOG" 2>/dev/null | jq -S 'del(.version)')" != "$(jq -S 'del(.version)' "$CATALOG")" ]; then
            changed="$changed $CATALOG"
          fi
          if [ -z "$changed" ]; then
            echo "No released content changed; the repository version stays at ${base:-$head}."
            exit 0
          fi
          if [ -n "$base" ] && [ "$(python3 "$SEMVER" compare "$head" "$base")" != "1" ]; then
            echo "::error::$changed changed and the repository version went from $base to $head, not up"
            exit 1
          fi
          echo "Repository version ${base:-none} -> $head for:$changed"

      # Release notes are written by a person, under "## X.Y.Z", never generated from subjects.
      - name: A new repository version carries its changelog section
        if: github.event_name == 'pull_request'
        run: |
          head=$(jq -r .version "$CATALOG")
          base=$(git show "origin/$BASE:$CATALOG" 2>/dev/null | jq -r '.version // empty' || true)
          if [ "$base" = "$head" ]; then
            echo "No new repository version in this pull request."
            exit 0
          fi
          notes=$(awk -v h="## $head" '$0 == h {f=1; next} f && /^## / {exit} f {print}' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::the repository moves to $head and CHANGELOG.md carries no '## $head' section"
            exit 1
          fi
          echo "CHANGELOG.md carries '## $head'."

  tag:
    name: tag the repository version
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    # Raised on this job alone, the only one that writes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # The tag is the version itself. A published tag is never moved: a repository pinned to it
      # must receive the same bytes forever.
      - name: Tag the repository version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(jq -r .version "$CATALOG")
          python3 "$SEMVER" valid "$version"
          head=$(git rev-parse HEAD)
          if existing=$(git rev-parse -q --verify "refs/tags/$version^{commit}"); then
            if [ "$existing" = "$head" ]; then
              echo "$version already points here, nothing to do."
            elif git diff --quiet "$existing" "$head" -- plugins/ .claude-plugin/; then
              echo "$version is published on $existing and nothing released changed since."
            else
              echo "::error::$version is published on $existing and plugins/ or the catalog changed since"
              echo "::error::a published version is never moved, raise the version instead"
              exit 1
            fi
          else
            git tag -a "$version" -m "$version"
            # Pushed with GITHUB_TOKEN, which does not retrigger a workflow, so no loop.
            git push origin "$version"
            echo "Published $version on $head."
          fi

      # Separate from the tagging step so that a tag published before this step existed still
      # gets its release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version "$CATALOG")
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists, nothing to do."
            exit 0
          fi
          notes=$(awk -v h="## $version" '$0 == h {f=1; next} f && /^## / {exit} f {print}' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md carries no '## $version' section"
            exit 1
          fi
          # A prerelease carries a hyphen before any build metadata, as in 1.2.0-rc.1+build.
          prerelease=""
          case "${version%%+*}" in *-*) prerelease="--prerelease" ;; esac
          printf '%s\n' "$notes" | gh release create "$version" --title "$version" --notes-file - $prerelease
          echo "Released $version."
