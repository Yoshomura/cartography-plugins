# Claude model name (agent frontmatter `model:`) -> Codex model slug.
# A project overrides any entry in its own `.codex/mirror.toml`, same sections, only the
# keys it changes. Per-agent overrides go under [agents.<name>] with `model`, `effort` or
# `sandbox_mode = "read-only"`.
#
# Slugs come from the Codex model list (https://learn.chatgpt.com/docs/models). Codex keeps
# its own copy of that list in ~/.codex/models_cache.json, and the sync script compares this
# table to it: a slug that disappeared or carries a retirement date is reported.

[models]
opus = "gpt-5.6-sol"
fable = "gpt-6-astra"
sonnet = "gpt-5.6-terra"
haiku = "gpt-5.6-luna"

# Claude effort -> Codex model_reasoning_effort. Codex also knows "max" and "ultra"; a
# project that wants them sets them per agent.
[efforts]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"
